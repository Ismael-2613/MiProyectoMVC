services:
  web:
    build: .
    ports:
      - "9090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Admin1234!
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/lib/sqlserver/data
      - ./backup:/var/opt/mssql/backup
    entrypoint: /bin/bash
    command: -c "/opt/mssql/bin/sqlservr & sleep 90 && /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Admin1234! -No -Q \"RESTORE DATABASE ProyectoMVC FROM DISK='/var/opt/mssql/backup/ProyectoSO.bak' WITH MOVE 'ProyectoMVC' TO '/var/opt/mssql/data/ProyectoMVC.mdf', MOVE 'ProyectoMVC_log' TO '/var/opt/mssql/data/ProyectoMVC_log.ldf', REPLACE; ALTER AUTHORIZATION ON DATABASE::ProyectoMVC TO sa\" && wait"
    
volumes:
  sqldata: